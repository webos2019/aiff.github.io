<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EmoMind - 图像生成</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <style>
    .image-gen-container {
      max-width: 900px;
      margin: 0 auto;
      padding: 40px 20px;
    }

    .header {
      text-align: center;
      margin-bottom: 40px;
    }

    .header h1 {
      font-size: 28px;
      font-weight: 700;
      color: #1A1F36;
      margin-bottom: 8px;
    }

    .header p {
      font-size: 15px;
      color: #8F9BB3;
    }

    .model-badge {
      display: inline-block;
      padding: 4px 12px;
      background: linear-gradient(135deg, #667EEA 0%, #764BA2 100%);
      color: white;
      border-radius: 100px;
      font-size: 12px;
      font-weight: 600;
      margin-top: 12px;
    }

    .main-card {
      background: #FFFFFF;
      border: 1px solid #E4E9F2;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.04);
      margin-bottom: 24px;
    }

    .section-title {
      font-size: 16px;
      font-weight: 600;
      color: #1A1F36;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .section-title::before {
      content: '';
      width: 4px;
      height: 16px;
      background: #3366FF;
      border-radius: 2px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      color: #333;
      margin-bottom: 8px;
    }

    .form-label small {
      font-weight: 400;
      color: #8F9BB3;
      font-size: 12px;
      margin-left: 8px;
    }

    .form-input {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid #E4E9F2;
      border-radius: 10px;
      font-size: 14px;
      font-family: 'Noto Sans SC', sans-serif;
      transition: border-color 0.3s, box-shadow 0.3s;
      box-sizing: border-box;
    }

    .form-input:focus {
      outline: none;
      border-color: #3366FF;
      box-shadow: 0 0 0 3px rgba(51, 102, 255, 0.1);
    }

    .form-textarea {
      width: 100%;
      padding: 14px 16px;
      border: 1px solid #E4E9F2;
      border-radius: 10px;
      font-size: 14px;
      font-family: 'Noto Sans SC', sans-serif;
      resize: vertical;
      min-height: 100px;
      transition: border-color 0.3s, box-shadow 0.3s;
      box-sizing: border-box;
    }

    .form-textarea:focus {
      outline: none;
      border-color: #3366FF;
      box-shadow: 0 0 0 3px rgba(51, 102, 255, 0.1);
    }

    .size-options {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .size-option {
      flex: 1;
      min-width: 140px;
      padding: 12px 16px;
      border: 2px solid #E4E9F2;
      border-radius: 10px;
      cursor: pointer;
      text-align: center;
      transition: all 0.3s;
      background: #FAFBFC;
    }

    .size-option:hover {
      border-color: #3366FF;
      background: #F0F5FF;
    }

    .size-option.selected {
      border-color: #3366FF;
      background: #E6F0FF;
      color: #3366FF;
      font-weight: 600;
    }

    .size-option .size-label {
      font-size: 14px;
    }

    .size-option .size-desc {
      font-size: 11px;
      color: #8F9BB3;
      margin-top: 4px;
    }

    .mode-tabs {
      display: flex;
      background: #F7F9FC;
      border-radius: 10px;
      padding: 4px;
      margin-bottom: 16px;
    }

    .mode-tab {
      flex: 1;
      padding: 10px 16px;
      text-align: center;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      color: #6B7A99;
      transition: all 0.3s;
    }

    .mode-tab.active {
      background: #FFFFFF;
      color: #3366FF;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
    }

    .image-upload-area {
      border: 2px dashed #E4E9F2;
      border-radius: 12px;
      padding: 32px;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s;
      background: #FAFBFC;
      position: relative;
    }

    .image-upload-area:hover {
      border-color: #3366FF;
      background: #F0F5FF;
    }

    .image-upload-area.dragover {
      border-color: #3366FF;
      background: #E6F0FF;
      transform: scale(1.02);
    }

    .image-upload-area.has-image {
      border-style: solid;
      border-color: #3366FF;
      background: #F0F5FF;
    }

    .upload-icon {
      font-size: 48px;
      margin-bottom: 12px;
    }

    .upload-text {
      font-size: 14px;
      color: #8F9BB3;
      margin-bottom: 8px;
    }

    .upload-hint {
      font-size: 12px;
      color: #B0B8C4;
    }

    #uploadedImage {
      max-width: 100%;
      max-height: 300px;
      border-radius: 8px;
      display: none;
      margin: 0 auto;
    }

    .image-upload-area.has-image .upload-content {
      display: none;
    }

    .image-upload-area.has-image #uploadedImage {
      display: block;
    }

    .remove-image-btn {
      display: none;
      position: absolute;
      top: 12px;
      right: 12px;
      background: rgba(255, 61, 113, 0.9);
      color: white;
      border: none;
      border-radius: 50%;
      width: 28px;
      height: 28px;
      font-size: 14px;
      cursor: pointer;
      line-height: 1;
      transition: background 0.3s;
    }

    .remove-image-btn:hover {
      background: #FF3D71;
    }

    .image-upload-area.has-image .remove-image-btn {
      display: block;
    }

    .generate-btn {
      width: 100%;
      padding: 14px 24px;
      background: linear-gradient(135deg, #3366FF 0%, #598BFF 100%);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 4px 16px rgba(51, 102, 255, 0.3);
    }

    .generate-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 24px rgba(51, 102, 255, 0.4);
    }

    .generate-btn:disabled {
      background: #B0B8C4;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    .generate-btn .spinner {
      width: 18px;
      height: 18px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .result-card {
      background: #FFFFFF;
      border: 1px solid #E4E9F2;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.04);
      display: none;
    }

    .result-card.show {
      display: block;
    }

    .result-image-container {
      text-align: center;
      margin-bottom: 20px;
    }

    .result-image-container img {
      max-width: 100%;
      max-height: 500px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
    }

    .result-actions {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .action-btn {
      padding: 10px 20px;
      border: 1px solid #E4E9F2;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      background: white;
      color: #6B7A99;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .action-btn:hover {
      border-color: #3366FF;
      color: #3366FF;
    }

    .action-btn.primary {
      background: #3366FF;
      color: white;
      border-color: #3366FF;
    }

    .action-btn.primary:hover {
      background: #2952CC;
      border-color: #2952CC;
    }

    .error-message {
      background: #FFF2F2;
      border: 1px solid #FFE0E0;
      border-radius: 10px;
      padding: 14px 16px;
      color: #FF3D71;
      font-size: 14px;
      margin-top: 16px;
      display: none;
    }

    .error-message.show {
      display: block;
    }

    .quick-prompts {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 12px;
    }

    .quick-prompt {
      padding: 6px 12px;
      background: #F0F5FF;
      border: 1px solid #D0E0FF;
      border-radius: 100px;
      font-size: 12px;
      color: #3366FF;
      cursor: pointer;
      transition: all 0.3s;
    }

    .quick-prompt:hover {
      background: #E6F0FF;
      border-color: #3366FF;
    }

    .api-key-group {
      position: relative;
    }

    .api-key-group .toggle-key {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: #8F9BB3;
      cursor: pointer;
      font-size: 14px;
    }

    .api-key-group .toggle-key:hover {
      color: #3366FF;
    }

    @media (max-width: 600px) {
      .image-gen-container {
        padding: 24px 16px;
      }

      .main-card {
        padding: 16px;
      }

      .size-options {
        flex-direction: column;
      }

      .size-option {
        min-width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="image-gen-container">
    <div class="header">
      <h1>🖼️ 图像生成</h1>
      <p>基于 Agnes-Image-2.0-Flash 模型的文生图与图生图工具</p>
      <span class="model-badge">Agnes-Image-2.0-Flash</span>
    </div>

    <div class="main-card">
      <div class="section-title">API 配置</div>
      <div class="form-group api-key-group">
        <label class="form-label">API Key <small>在 Agnes AI 控制台获取</small></label>
        <input type="password" id="apiKey" class="form-input" placeholder="sk-xxx...">
        <button class="toggle-key" id="toggleKey" onclick="toggleApiKey()">👁️</button>
      </div>
    </div>

    <div class="main-card">
      <div class="section-title">生成模式</div>
      <div class="mode-tabs">
        <div class="mode-tab active" onclick="switchMode('text')">📝 文生图</div>
        <div class="mode-tab" onclick="switchMode('image')">🖼️ 图生图</div>
      </div>

      <div class="form-group">
        <label class="form-label">提示词 <small>描述你想要生成的图像</small></label>
        <textarea id="prompt" class="form-textarea" placeholder="例如：A professional product photo of a glass cube on a white studio background, soft shadows, high detail"></textarea>
        <div class="quick-prompts">
          <span class="quick-prompt" onclick="setPrompt('A beautiful sunset over the ocean, golden hour, cinematic lighting')">🌅 海边日落</span>
          <span class="quick-prompt" onclick="setPrompt('A cute cat wearing glasses, cartoon style, pastel colors')">🐱 卡通猫咪</span>
          <span class="quick-prompt" onclick="setPrompt('A futuristic cyberpunk city at night, neon lights, rain')">🌃 赛博朋克城市</span>
          <span class="quick-prompt" onclick="setPrompt('A professional portrait of a young woman, soft studio lighting')">👩 人像写真</span>
          <span class="quick-prompt" onclick="setPrompt('A delicious sushi platter, food photography, high detail')">🍣 美食摄影</span>
          <span class="quick-prompt" onclick="setPrompt('A fantasy castle in the clouds, magical atmosphere')">🏰 梦幻城堡</span>
        </div>
      </div>

      <div class="form-group" id="imageUploadSection" style="display: none;">
        <label class="form-label">输入图像 <small>支持公网URL或本地上传</small></label>
        <div class="image-upload-area" id="uploadArea" onclick="document.getElementById('imageInput').click()">
          <button class="remove-image-btn" onclick="event.stopPropagation(); clearImage()">×</button>
          <div class="upload-content">
            <div class="upload-icon">📷</div>
            <div class="upload-text">点击或拖拽上传图像</div>
            <div class="upload-hint">支持 JPG、PNG 格式，最大 10MB</div>
          </div>
          <img id="uploadedImage" src="" alt="上传的图像">
        </div>
        <input type="file" id="imageInput" accept="image/*" style="display: none;" onchange="handleImageUpload(this)">
        <div style="margin-top: 12px;">
          <input type="text" id="imageUrl" class="form-input" placeholder="或输入图像URL...">
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">图像尺寸</label>
        <div class="size-options">
          <div class="size-option selected" data-size="1024x768" onclick="selectSize(this)">
            <div class="size-label">1024 × 768</div>
            <div class="size-desc">横版</div>
          </div>
          <div class="size-option" data-size="1024x1024" onclick="selectSize(this)">
            <div class="size-label">1024 × 1024</div>
            <div class="size-desc">正方形</div>
          </div>
          <div class="size-option" data-size="768x1024" onclick="selectSize(this)">
            <div class="size-label">768 × 1024</div>
            <div class="size-desc">竖版</div>
          </div>
        </div>
      </div>

      <button class="generate-btn" id="generateBtn" onclick="generateImage()">
        <span>🚀 开始生成</span>
      </button>

      <div class="error-message" id="errorMessage"></div>
    </div>

    <div class="result-card" id="resultCard">
      <div class="section-title">生成结果</div>
      <div class="result-image-container">
        <img id="resultImage" src="" alt="生成的图像">
      </div>
      <div class="result-actions">
        <button class="action-btn primary" onclick="downloadImage()">💾 下载图像</button>
        <button class="action-btn" onclick="copyImageUrl()">🔗 复制链接</button>
        <button class="action-btn" onclick="regenerateImage()">🔄 重新生成</button>
      </div>
    </div>
  </div>

  <script>
    let currentMode = 'text';
    let selectedSize = '1024x768';
    let uploadedImageBase64 = null;
    let resultImageUrl = null;

    function toggleApiKey() {
      const input = document.getElementById('apiKey');
      const toggle = document.getElementById('toggleKey');
      if (input.type === 'password') {
        input.type = 'text';
        toggle.textContent = '🙈';
      } else {
        input.type = 'password';
        toggle.textContent = '👁️';
      }
    }

    function switchMode(mode) {
      currentMode = mode;
      document.querySelectorAll('.mode-tab').forEach(tab => {
        tab.classList.remove('active');
      });
      event.target.classList.add('active');

      const uploadSection = document.getElementById('imageUploadSection');
      if (mode === 'image') {
        uploadSection.style.display = 'block';
      } else {
        uploadSection.style.display = 'none';
      }
    }

    function selectSize(element) {
      document.querySelectorAll('.size-option').forEach(opt => {
        opt.classList.remove('selected');
      });
      element.classList.add('selected');
      selectedSize = element.dataset.size;
    }

    function setPrompt(text) {
      document.getElementById('prompt').value = text;
    }

    function handleImageUpload(input) {
      if (input.files && input.files[0]) {
        const file = input.files[0];
        if (file.size > 10 * 1024 * 1024) {
          showError('图像大小不能超过 10MB');
          return;
        }

        const reader = new FileReader();
        reader.onload = function(e) {
          uploadedImageBase64 = e.target.result;
          document.getElementById('uploadedImage').src = uploadedImageBase64;
          document.getElementById('uploadArea').classList.add('has-image');
          document.getElementById('imageUrl').value = '';
        };
        reader.readAsDataURL(file);
      }
    }

    function clearImage() {
      uploadedImageBase64 = null;
      document.getElementById('uploadedImage').src = '';
      document.getElementById('uploadArea').classList.remove('has-image');
      document.getElementById('imageInput').value = '';
      document.getElementById('imageUrl').value = '';
    }

    document.getElementById('uploadArea').addEventListener('dragover', function(e) {
      e.preventDefault();
      this.classList.add('dragover');
    });

    document.getElementById('uploadArea').addEventListener('dragleave', function(e) {
      e.preventDefault();
      this.classList.remove('dragover');
    });

    document.getElementById('uploadArea').addEventListener('drop', function(e) {
      e.preventDefault();
      this.classList.remove('dragover');
      const files = e.dataTransfer.files;
      if (files && files[0]) {
        document.getElementById('imageInput').files = files;
        handleImageUpload(document.getElementById('imageInput'));
      }
    });

    async function generateImage() {
      const apiKey = document.getElementById('apiKey').value.trim();
      const prompt = document.getElementById('prompt').value.trim();

      if (!apiKey) {
        showError('请输入 API Key');
        return;
      }

      if (!prompt) {
        showError('请输入提示词');
        return;
      }

      const btn = document.getElementById('generateBtn');
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span><span>正在生成中...</span>';
      hideError();
      document.getElementById('resultCard').classList.remove('show');

      const requestBody = {
        model: 'agnes-image-2.1-flash',
        prompt: prompt,
        size: selectedSize,
        extra_body: {
          response_format: 'url'
        }
      };

      if (currentMode === 'image') {
        const imageUrl = document.getElementById('imageUrl').value.trim();
        if (imageUrl) {
          requestBody.image = [imageUrl];
        } else if (uploadedImageBase64) {
          requestBody.image = [uploadedImageBase64];
        } else {
          btn.disabled = false;
          btn.innerHTML = '<span>🚀 开始生成</span>';
          showError('图生图模式请上传图像或输入图像URL');
          return;
        }
      }

      try {
        const response = await fetch('https://apihub.agnes-ai.com/v1/images/generations', {
          method: 'POST',
          headers: {
            'Authorization': `Bearer ${apiKey}`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(requestBody),
          timeout: 300000
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error?.message || '生成失败');
        }

        if (data.data && data.data[0]) {
          resultImageUrl = data.data[0].url;
          if (resultImageUrl) {
            document.getElementById('resultImage').src = resultImageUrl;
            document.getElementById('resultCard').classList.add('show');
          } else if (data.data[0].b64_json) {
            resultImageUrl = `data:image/png;base64,${data.data[0].b64_json}`;
            document.getElementById('resultImage').src = resultImageUrl;
            document.getElementById('resultCard').classList.add('show');
          } else {
            showError('未返回图像数据');
          }
        } else {
          showError('生成失败，未返回结果');
        }
      } catch (error) {
        console.error('生成错误:', error);
        showError('生成失败: ' + error.message);
      } finally {
        btn.disabled = false;
        btn.innerHTML = '<span>🚀 开始生成</span>';
      }
    }

    function regenerateImage() {
      generateImage();
    }

    function downloadImage() {
      if (resultImageUrl) {
        const link = document.createElement('a');
        link.href = resultImageUrl;
        link.download = `generated-image-${Date.now()}.png`;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      }
    }

    function copyImageUrl() {
      if (resultImageUrl) {
        navigator.clipboard.writeText(resultImageUrl).then(() => {
          showSuccess('链接已复制');
        }).catch(() => {
          showError('复制失败');
        });
      }
    }

    function showError(message) {
      const errorDiv = document.getElementById('errorMessage');
      errorDiv.textContent = message;
      errorDiv.classList.add('show');
    }

    function hideError() {
      document.getElementById('errorMessage').classList.remove('show');
    }

    function showSuccess(message) {
      const errorDiv = document.getElementById('errorMessage');
      errorDiv.textContent = message;
      errorDiv.style.background = '#EDFFF5';
      errorDiv.style.borderColor = '#B8E8D0';
      errorDiv.style.color = '#009E60';
      errorDiv.classList.add('show');
      setTimeout(() => {
        hideError();
        errorDiv.style.background = '#FFF2F2';
        errorDiv.style.borderColor = '#FFE0E0';
        errorDiv.style.color = '#FF3D71';
      }, 3000);
    }
  </script>
</body>
</html>
